# Vale checks the writing of the README and the website. CONTRIBUTING.md
# says how to run it, and .vale/README.md where the styles come from.
# Filler and generic phrasing, and sentences over 25 words, fail the check;
# everything else is a warning or a suggestion.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = CCBabysitter

[formats]
# The summary for AI tools is Markdown in a .txt file.
txt = md

[{*.{md,html},site/llms.txt}]
BasedOnStyles = Google, Readability, ai-tells, CCBabysitter

# The opening of the README and of the website, in vale off and vale on
# comments, keeps its own voice and is not checked.

# Every file is plain ASCII, so there are no dashes for this rule to find.
Google.EmDash = NO
# A full stop or comma goes inside quotes only when it is part of what is
# quoted.
Google.Quotes = NO
# The rest of Google's style is advice here, not a failed check.
Google.AMPM = warning
Google.DateFormat = warning
Google.Exclamation = warning
Google.GenderBias = warning
Google.Gender = warning
Google.LyHyphens = warning
Google.Latin = warning
Google.OptionalPlurals = warning
Google.Ordinal = warning
Google.Periods = warning
Google.Spacing = warning
Google.Slang = warning
Google.Units = warning

# Here a process dies, a session survives and is reachable, a background
# copy carries a session, a setting stays set and a full id wins: these
# are the plain words for what happens, not metaphors. CCBabysitter.Idioms
# fails on the idioms these rules would also catch.
ai-tells.MortalityMetaphors = NO
ai-tells.BareReaches = NO
ai-tells.FigurativeCarries = NO
ai-tells.FigurativeStays = NO
ai-tells.FigurativeWins = NO
# Reference text is made of lists, rules and colons before examples. These
# shapes are worth a second look, not a failed check.
ai-tells.VerbTricolon = suggestion
ai-tells.StackedAnaphora = suggestion
ai-tells.CataphoricForecasting = suggestion
ai-tells.ColonUsage = suggestion
ai-tells.NegatedSubject = suggestion
ai-tells.NegatedObject = suggestion
ai-tells.UniversalSubject = suggestion
ai-tells.ConsequenceClause = suggestion
ai-tells.CoordinatedReveal = suggestion
ai-tells.DefensiveHedges = suggestion
# This rule also catches "for example" and "in particular", which plain
# English needs; CCBabysitter.Transitions fails on the filler ones instead.
ai-tells.FormalTransitions = suggestion
# Two sentences usually read better than one joined with a semicolon.
ai-tells.SemicolonUsage = warning

[{site/ccbabysitter/**,site/llms.txt}]
# The pages Go reads for the module path, and the summary for AI tools, are
# a few lines for a machine, so grade-level checks say nothing useful about
# them.
BasedOnStyles = Google, ai-tells, CCBabysitter

[*README.md]
# The README carries the reference text in longer sentences than the
# website does, so a long sentence there is a warning; on the website it
# fails the check.
CCBabysitter.SentenceLength = warning
