name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The page tests run the page's own JavaScript under node and skip
      # when it is missing. Here a skip would hide a broken page, so a
      # missing node fails the run instead.
      - name: Check node
        shell: bash
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::node is not on PATH; the page tests in internal/web need it and would be skipped"
            exit 1
          fi
          node --version

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: go test ${{ runner.os != 'Windows' && '-race' || '' }} ./...

      # install.ps1 has no test harness; Windows PowerShell 5.1, the one
      # every Windows has, at least has to read it.
      - name: Parse the Windows install script
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw scripts/install.ps1), [ref]$errors)
          if ($errors) { $errors; exit 1 }

      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
          fi
          test -z "$unformatted"

  # The install scripts and the release workflow agree on how the release
  # files are built and named. This runs the install script's tests and
  # builds every release target the way release.yml does, so a change that
  # breaks either side fails here rather than on a release tag.
  release-files:
    name: release files (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test the install script
        run: sh scripts/test-install.sh

      - name: Build every release target
        run: |
          out_dir="$RUNNER_TEMP/dist"
          mkdir -p "$out_dir"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            out="$out_dir/ccbabysitter-$os-$arch$ext"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/ccbabysitter
            echo "Built $out"
            if [ "$os" = windows ]; then
              out="$out_dir/ccbabysitter-background-$os-$arch$ext"
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui" -o "$out" ./cmd/ccbabysitter
              echo "Built $out"
            fi
          done

  # install.ps1 has no harness of its own, and there is no Windows to try it
  # on by hand for every change: this installs a fresh build with Windows
  # PowerShell 5.1, the one every Windows has, starts CC Babysitter in the
  # background, then installs again over the running copy, the way an
  # update does, and checks it runs afterwards.
  windows-install:
    name: install on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build the Windows release files
        shell: bash
        run: |
          d="$RUNNER_TEMP/rel"
          mkdir -p "$d"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$d/ccbabysitter-windows-amd64.exe" ./cmd/ccbabysitter
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui" -o "$d/ccbabysitter-background-windows-amd64.exe" ./cmd/ccbabysitter
          (cd "$d" && sha256sum ccbabysitter-* > checksums.txt && cat checksums.txt)

      - name: Install, start in the background, and update over it
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $rel = Join-Path $env:RUNNER_TEMP 'rel'
          $server = Start-Process -FilePath python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1' -WorkingDirectory $rel -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $env:CCBABYSITTER_DOWNLOAD_URL = 'http://127.0.0.1:8765'
          $env:CCBABYSITTER_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'ccb'
          $ccb = Join-Path $env:CCBABYSITTER_INSTALL_DIR 'ccbabysitter.exe'
          try {
            Write-Host '--- fresh install'
            powershell -NoProfile -File scripts/install.ps1
            if ($LASTEXITCODE -ne 0) { throw 'the fresh install failed' }
            if (-not (Test-Path (Join-Path $env:CCBABYSITTER_INSTALL_DIR 'ccbabysitter-background.exe'))) { throw 'no windowless program was installed' }
            Write-Host '--- start in the background'
            & $ccb --no-open
            if ($LASTEXITCODE -ne 0) { throw 'ccbabysitter did not start in the background' }
            & $ccb status
            if ($LASTEXITCODE -ne 0) { throw 'not running after the start' }
            Write-Host '--- update over the running copy'
            powershell -NoProfile -File scripts/install.ps1
            if ($LASTEXITCODE -ne 0) { throw 'the update failed' }
            & $ccb status
            if ($LASTEXITCODE -ne 0) { throw 'not running after the update' }
            & $ccb activity -n 10
            Write-Host '--- quit'
            & $ccb quit
            if ($LASTEXITCODE -ne 0) { throw 'quit failed' }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
